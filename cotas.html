<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Impresión de Cotas SGB Canaima</title>
    <style>
        body { margin: 0; padding: 1.5cm; background: #fff; font-family: 'Courier New', monospace; }
        .grid { display: grid; grid-template-columns: repeat(4, 3.5cm); gap: 0.4cm; justify-content: start; }
        .cota { 
            width: 3.5cm; 
            height: 5.0cm; 
            border: 1px dashed #444; 
            padding: 0.2cm;
            box-sizing: border-box; 
            text-align: center; 
            background: #fff;
            font-size: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .header { font-family: Arial, sans-serif; font-size: 7px; font-weight: bold; color: #777; margin-bottom: 2px; }
        .line { border-bottom: 1px solid #ccc; margin: 2px 0; }
        .valor-cota { font-size: 13px; font-weight: bold; color: #000; margin-top: 5px; }
        .id-cota { font-size: 10px; font-weight: bold; color: blue; }
        .titulo-cota { font-family: Arial, sans-serif; font-size: 8px; text-transform: uppercase; margin-top: 4px; overflow: hidden; height: 18px; }
        @media print {
            body { padding: 0; }
            .cota { page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div class="grid">

        <div class="cota">
            <div>
                <div class="header">MIN. EDUCACIÓN / SGB</div>
                <div class="line"></div>
                <div class="valor-cota">800/CER-2021</div>
            </div>
            <div>
                <div class="id-cota">EJ-QUIJOTE-001</div>
                <div class="line"></div>
                <div class="titulo-cota">Don Quijote de l..</div>
            </div>
        </div>
        <div class="cota">
            <div>
                <div class="header">MIN. EDUCACIÓN / SGB</div>
                <div class="line"></div>
                <div class="valor-cota">800/CER-2021</div>
            </div>
            <div>
                <div class="id-cota">EJ-QUIJOTE-002</div>
                <div class="line"></div>
                <div class="titulo-cota">Don Quijote de l..</div>
            </div>
        </div>
        <div class="cota">
            <div>
                <div class="header">MIN. EDUCACIÓN / SGB</div>
                <div class="line"></div>
                <div class="valor-cota">000/MAR-2008</div>
            </div>
            <div>
                <div class="id-cota">EJ-CLEAN-001</div>
                <div class="line"></div>
                <div class="titulo-cota">Clean Code</div>
            </div>
        </div>
    </div>
</body>
</html>
