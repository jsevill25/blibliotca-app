<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ficha Bibliográfica - Humor y proza</title>
    <style>
        body { background: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Times New Roman', Times, serif; }
        .ficha { 
            width: 12.5cm; 
            height: 7.5cm; 
            background: #fff; 
            border: 1px solid #999; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
            padding: 1.0cm;
            box-sizing: border-box;
            position: relative;
        }
        .cota { font-family: monospace; font-size: 14px; font-weight: bold; color: red; position: absolute; left: 1cm; top: 1cm; line-height: 1.2; }
        .cuerpo { margin-left: 3.2cm; font-size: 13px; line-height: 1.4; }
        .autor { font-weight: bold; font-size: 14px; text-transform: uppercase; margin-bottom: 5px; }
        .titulo { margin-bottom: 10px; }
        .detalles { font-size: 12px; color: #333; }
        .agujero { 
            width: 0.5cm; 
            height: 0.5cm; 
            border: 1px solid #444; 
            border-radius: 50%; 
            position: absolute; 
            bottom: 0.3cm; 
            left: 50%; 
            transform: translateX(-50%);
            background: #fff;
        }
    </style>
</head>
<body>
    <div class="ficha">
        <div class="cota">800<br>N605h<br>1990</div>
        <div class="cuerpo">
            <div class="autor">Aquile Nazoa</div>
            <div class="titulo">Humor y proza. -- 2da Edición. -- perro y  la rana, 1990.</div>
            <div class="detalles">
                ISBN: sfgfgf<br>
                Idioma: Español | Origen: Biblioteca Nacional<br>
                Ubicación Central: Sala Sala General - Estante Estante A-1
            </div>
        </div>
        <div class="agujero"></div>
    </div>
</body>
</html>
